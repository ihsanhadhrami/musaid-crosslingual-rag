- concept_id: salary
  kb_term: salary
  category: general
  variants:
    msa: [الراتب, الأجر الشهري]
    gulf: [راتبي, المعاش]
    levantine_egyptian: [المرتب, المعاش بتاعي, معاشي]
    arabizi: [el ratib, ratbi, el morattab, ma3ash]
  notes: "Gulf and Egyptian speakers both use معاش for a monthly salary, not only a pension."

- concept_id: weekend_holiday
