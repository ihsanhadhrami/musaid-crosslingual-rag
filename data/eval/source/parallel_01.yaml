# pg-001: wrong-transfer money back after dispute approval, Saudi Arabia
- <<: &pg001
    parallel_group: pg-001
    type: number_sensitive
    country: SA
    gold_chunk_ids: [kb-0075#c1, kb-0071#c1, kb-0072#c0]
    reference_answer: >-
      In Saudi Arabia, once a wrong-transfer dispute is approved, the money is returned within
      5 business days, counted from the approval date.
    critical_facts: ["5 business days"]
    notes: "Competitor kb-0075#c0 has deadlines and investigation times, not the return time."
  qid: q-0001
  variety: english
  query: "I sent 800 riyals to the wrong guy by mistake. You approved my dispute yesterday, how long before the money is back in my wallet?"
  difficulty: medium
- <<: *pg001
  qid: q-0002
  variety: msa
  query: "حوّلت مبلغ ٨٠٠ ريال إلى شخص آخر بالخطأ، وتمت الموافقة على الاعتراض. متى سيعود المبلغ إلى رصيدي؟"
  difficulty: medium
- <<: *pg001
  qid: q-0003
  variety: gulf
  query: "حولت ٨٠٠ ريال لواحد غلط ووافقتوا على الاعتراض، متى ترجع فلوسي؟"
