    type: policy_eligibility
    country: null
    gold_chunk_ids: [kb-0195#c0]
    reference_answer: >-
      Usually Sahla Pay gives at least 60 calendar days notice before closing an account. When the
      closure relates to suspected fraud or a legal requirement it can act immediately without
      notice and may be unable to give the reason; the balance is then sent to a bank account in
