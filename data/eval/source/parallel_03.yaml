# pg-029: can't pay a new recipient right after setting up a new phone
- <<: &pg029
    parallel_group: pg-029
    type: troubleshooting
    country: null
    gold_chunk_ids: [kb-0178#c0, kb-0160#c0, kb-0170#c0]
    reference_answer: >-
      For 24 hours after you set up Sahla Pay on a new phone, transfers to new recipients and
      international transfers are paused. People you've paid before, card payments and QR payments
      work normally.
    critical_facts: ["24 hours"]
    notes: >-
      Close to pg-010 (SIM change) but a different trigger; kb-0161#c0 is a hard negative here. kb-0013#c0 (changing phone number) has a 24-hour pause for a different trigger; hard negative.
  qid: q-0169
  variety: english
  query: "Set up the app on my new phone today and now I can't send money to my cousin, I've never paid him before. Why?"
  difficulty: medium
