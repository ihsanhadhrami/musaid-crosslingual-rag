# pg-021: is it too late to dispute a wrong transfer after a month, UAE
- <<: &pg021
    parallel_group: pg-021
    type: number_sensitive
    country: AE
    gold_chunk_ids: [kb-0075#c0, kb-0077#c0, kb-0201#c12]
    reference_answer: >-
      For UAE accounts a wrong-transfer dispute must be opened within 45 calendar days of the
      transfer, so after about a month you can still file it in Activity > Report a problem >
      I sent it to the wrong person.
    critical_facts: ["45 calendar days"]
    notes: "Also in kb-0097#c0 (Refunds FAQ); left out under the 3-chunk cap."
  qid: q-0121
  variety: english
  query: "I sent dirhams to the wrong account about a month ago and only just noticed. Is it too late to open a dispute?"
  difficulty: medium
