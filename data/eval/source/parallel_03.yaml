# pg-025: should I resubmit my ID while it's "In review"?
- <<: &pg025
    parallel_group: pg-025
    type: troubleshooting
    country: null
    gold_chunk_ids: [kb-0007#c0, kb-0009#c0]
    reference_answer: >-
      No. Submitting again starts a new review, cancels the earlier one and puts you at the end of
      the queue. Wait for your country's review period; if it has passed, check for a request from
      Sahla Pay, then contact Help.
    critical_facts: []
  qid: q-0145
  variety: english
  query: "My verification has been 'In review' since yesterday. Should I just upload my ID again to speed it up?"
  difficulty: medium
