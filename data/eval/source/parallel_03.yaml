# pg-026: unverified in Dubai: daily sending limit + what's needed to verify (multi-hop)
- <<: &pg026
    parallel_group: pg-026
    type: multi_hop
    country: AE
    gold_chunk_ids: [kb-0140#c0, kb-0004#c0, kb-0010#c0]
    reference_answer: >-
      An unverified UAE account can send up to AED 1,000 a day to other Sahla Pay users, with no
      bank or international transfers. To verify, you need a valid Emirates ID (both sides) and a
      selfie taken in the app.
    critical_facts: ["AED 1,000", "Emirates ID"]
    notes: >-
      Hop 1 (limit): kb-0140#c0, with kb-0010#c0 as an equivalent. Hop 2 (documents): kb-0004#c0. gold_source comes out mixed: rewritten + draft. kb-0068#c0 is a second equivalent for hop 1; left out under the cap.
  qid: q-0151
  variety: english
  query: "My account isn't verified yet and I'm in Dubai. How much can I send per day, and what do I need to get verified?"
  difficulty: hard
