# pg-015: a card payment the customer didn't make, UAE (dirhams)
- <<: &pg015
    parallel_group: pg-015
    type: number_sensitive
    country: AE
    gold_chunk_ids: [kb-0090#c0, kb-0215#c0, kb-0170#c0]
    reference_answer: >-
      Freeze the card, change your password and report it in Activity with Report a problem >
      I didn't make this. If you report it within 2 calendar days and didn't share your password,
      PIN or one-time password, it's refunded in full once confirmed as unauthorized.
    critical_facts: ["2 calendar days", "I didn't make this"]
  qid: q-0085
