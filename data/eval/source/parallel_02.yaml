    parallel_group: pg-017
    type: troubleshooting
    country: null
    gold_chunk_ids: [kb-0187#c0]
    reference_answer: >-
      Probably. A VPN can make it look like you're signing in from another country, which can trigger
      extra security checks, a transfer held for review or a blocked login. Turn off the VPN while
      using Sahla Pay.
