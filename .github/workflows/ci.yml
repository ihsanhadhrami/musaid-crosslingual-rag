name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m "not integration"
      - name: KB builds cleanly and committed outputs are current
        run: uv run python -m musaid.ingest.build --check

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: musaid
          POSTGRES_USER: musaid
          POSTGRES_PASSWORD: musaid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musaid -d musaid"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Enable pgvector
        run: psql postgresql://musaid:musaid@localhost:5432/musaid -f docker/postgres/init.sql
      # Langfuse isn't started in CI; its health test skips when no keys are set.
      - run: uv run pytest -m integration

  # eval-gate: added in Phase 6 (60-query smoke subset, per-variety tolerance).
